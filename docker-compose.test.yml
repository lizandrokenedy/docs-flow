# Stack isolada para testes: Postgres efêmero + API + runner Jest.
# Uso: npm run test (chama ensure-docker-deps antes para node_modules no host)

name: docs-flow-test

x-test-api-build: &test-api-build
  image: node:22-alpine
  user: '${DEV_UID:-1000}:${DEV_GID:-1000}'
  working_dir: /app
  env_file: .env.test
  environment:
    HOME: /tmp
    NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    PRISMA_HIDE_UPDATE_MESSAGE: '1'
  volumes:
    - .:/app

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docsflow
      POSTGRES_PASSWORD: docsflow
      POSTGRES_DB: docsflow_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docsflow -d docsflow_test']
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  migrate-test:
    <<: *test-api-build
    depends_on:
      postgres-test:
        condition: service_healthy
    working_dir: /app/apps/api
    restart: 'no'
    command: >
      sh -c "npx prisma generate &&
             npx prisma migrate deploy"

  api-test:
    <<: *test-api-build
    depends_on:
      migrate-test:
        condition: service_completed_successfully
    working_dir: /app
    tmpfs:
      - /app/uploads
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/health'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s
    command: >
      sh -c "set -e &&
             npm run build --workspace=@docs-flow/types &&
             cd apps/api &&
             npx prisma generate &&
             npx nest build &&
             exec node dist/main.js"

  test:
    <<: *test-api-build
    depends_on:
      api-test:
        condition: service_healthy
    working_dir: /app
    restart: 'no'
    environment:
      TEST_API_URL: ''
    command: npx jest --coverage --ci
