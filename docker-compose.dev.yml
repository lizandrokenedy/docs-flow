# Desenvolvimento: dependências e builds de pacotes rodam no Docker e refletem no host
# (node_modules, packages/*/dist). Não é necessário npm install local.
#
# Uso: ./scripts/build.sh dev

name: docs-flow-dev

x-dev-base: &dev-base
  image: node:22-alpine
  user: '${DEV_UID:-1000}:${DEV_GID:-1000}'
  working_dir: /app
  volumes:
    - .:/app
  environment:
    HOME: /tmp
    NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    PRISMA_HIDE_UPDATE_MESSAGE: '1'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docsflow
      POSTGRES_PASSWORD: docsflow
      POSTGRES_DB: docsflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docsflow']
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  install:
    <<: *dev-base
    profiles: [setup]
    restart: 'no'
    command: >
      sh -c "LOCKFILE=node_modules/.package-lock.json &&
             if [ ! -d node_modules/@docs-flow/types ] || [ ! -f \"$$LOCKFILE\" ] || ! cmp -s package-lock.json \"$$LOCKFILE\"; then
               npm install --ignore-scripts;
             else
               echo 'node_modules up to date, skipping npm install';
             fi &&
             npm run build --workspace=@docs-flow/types &&
             npm run build --workspace=@docs-flow/ui &&
             cd apps/api && npx prisma generate"

  migrate:
    <<: *dev-base
    profiles: [setup]
    environment:
      DATABASE_URL: postgresql://docsflow:docsflow@postgres:5432/docsflow?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    command: >
      sh -c "cd apps/api &&
             npx prisma migrate deploy"

  seed:
    <<: *dev-base
    profiles: [setup]
    environment:
      DATABASE_URL: postgresql://docsflow:docsflow@postgres:5432/docsflow?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    command: >
      sh -c "cd apps/api &&
             npx prisma db seed"

  api:
    <<: *dev-base
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://docsflow:docsflow@postgres:5432/docsflow?schema=public
      UPLOAD_DIR: /app/uploads
      WEB_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      PORT: 4000
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-60000}
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    command: >
      sh -c "npm run build --workspace=@docs-flow/types &&
             cd apps/api && npx prisma generate &&
             cd /app && npm run dev --workspace=@docs-flow/api"

  admin:
    <<: *dev-base
    ports:
      - '3001:3001'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
    depends_on:
      - api
    command: >
      sh -c "npm run dev --workspace=@docs-flow/ui &
             npm run dev --workspace=@docs-flow/admin"

  web:
    <<: *dev-base
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    command: >
      sh -c "npm run dev --workspace=@docs-flow/ui &
             npm run dev --workspace=@docs-flow/web"

volumes:
  postgres_data:
    name: docs-flow-dev_postgres_data
  uploads_data:
    name: docs-flow-dev_uploads_data
